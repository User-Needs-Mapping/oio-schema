name: Release

on:
  push:
    branches: [main]

# While changesets are waiting on main, keeps a "Version packages" pull request open.
# Merging it bumps package.json, writes CHANGELOG.md and dates the new heading.
#
# Once no changesets are waiting, which is straight after that pull request merges, the
# version in package.json is released: if its tag does not exist yet, a GitHub Release is
# published that creates the tag `v<version>` on the pushed commit, with that version's
# changelog entry as the notes. A push that changes no version finds the tag already there
# and does nothing.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Open or update the Version packages pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          title: "Version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish the release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists; nothing to release."
            exit 0
          fi
          node scripts/changelog-entry.mjs "${version}" \
            --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" > "${RUNNER_TEMP}/notes.md"
          prerelease=""
          case "${version}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${tag}" ${prerelease} \
            --target "${GITHUB_SHA}" \
            --title "${version}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
